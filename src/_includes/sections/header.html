<header id="cs-navigation">
    <div class="cs-container">
        <!--Nav Logo-->
        <a href="/" class="cs-logo" aria-label="Return to Aroy Thai Home page">
            <img src="/assets/svgs/logo-w.svg" alt="" width="197" height="43" aria-hidden="true" decoding="async">
        </a>
        <!--Navigation List-->
        <nav class="cs-nav" aria-label="main navigation">
            <!--Mobile Nav Toggle-->
            <button class="cs-toggle" aria-label="mobile menu toggle" aria-expanded="false" aria-controls="cs-ul-wrapper" aria-haspopup="menu">
                <span class="cs-box" aria-hidden="true">
                    <span class="cs-line cs-line1"></span>
                    <span class="cs-line cs-line2"></span>
                    <span class="cs-line cs-line3"></span>
                </span>
            </button>
            <!-- We need a wrapper div so we can set a fixed height on the cs-ul in case the nav list gets too long from too many dropdowns being opened and needs to have an overflow scroll. This wrapper acts as the background so it can go the full height of the screen and not cut off any overflowing nav items while the cs-ul stops short of the bottom of the screen, which keeps all nav items in view no matter how mnay there are-->
            <div class="cs-ul-wrapper" id="cs-ul-wrapper">
               <ul id="cs-expanded" class="cs-ul">
                    <li class="cs-li">
                        <a href="/" class="cs-li-link {% if page.url == "/" %} cs-active {% endif %}" {% if page.url == "/" %} aria-current="page" {% endif %}>
                            Home
                        </a>
                    </li>
                    <li class="cs-li">
                        <a href="/about/" class="cs-li-link {% if page.url == "/about/" %} cs-active {% endif %}" {% if page.url == "/about/" %} aria-current="page" {% endif %}>
                            About
                        </a>
                    </li>
                    <!--Copy and paste this cs-dropdown list item and replace any .cs-li with this cs-dropdown group to make a new dropdown and it will work-->
                    <!-- Note: When copying this dropdown, update the id attribute with an appropriate name (e.g., "services-dropdown-toggle", "products-dropdown-toggle") and ensure the aria-labelledby attribute on the ul matches the button's id -->
                    <li class="cs-li cs-dropdown">
                        <button class="cs-li-link cs-dropdown-toggle {% if page.url == "/menu/" %} cs-active {% endif %}" aria-haspopup="menu" aria-expanded="false" id="projects-dropdown-toggle">
                            Menu
                            <img class="cs-drop-icon" src="/assets/svgs/dropdown.svg" alt="" width="15" height="15" decoding="async" aria-hidden="true">
                        </button>
                        <ul class="cs-drop-ul" aria-labelledby="projects-dropdown-toggle">
                            <li class="cs-drop-li">
                                <a href="/menu/" class="cs-li-link cs-drop-link {% if page.url == "/menu/" %} cs-active {% endif %}" {% if page.url == "/menu/" %} aria-current="page" {% endif %}>All Day Menu</a>
                            </li>
                            <li class="cs-drop-li">
                                <a href="https://assets.cdn.filesafe.space/eKn2BU8jmQy7brpTtqf0/media/69f5fd3a52d70cb766978a4e.pdf" class="cs-li-link cs-drop-link" target="_blank" rel="noopener">Lunch Menu</a>
                            </li>
                            <li class="cs-drop-li">
                                <a href="https://assets.cdn.filesafe.space/eKn2BU8jmQy7brpTtqf0/media/69f5fd3a6b07ab330308076b.pdf" class="cs-li-link cs-drop-link" target="_blank" rel="noopener">Showcase Menu</a>
                            </li>
                            <li class="cs-drop-li">

                            </li>
                        </ul>
                    </li>
                    <li class="cs-li cs-dropdown">
                        <button class="cs-li-link cs-dropdown-toggle {% if page.url == "/delivery/" %} cs-active {% endif %}" aria-haspopup="delivery" aria-expanded="false" id="projects-dropdown-toggle">
                            Delivery

                        </button>
                        <ul class="cs-drop-ul" aria-labelledby="projects-dropdown-toggle">
                            <li class="cs-drop-li">

                            Blog

                    <li class="cs-li ">
